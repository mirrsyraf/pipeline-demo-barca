name: Daily Barça pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC (2:00 PM Malaysia time)
  workflow_dispatch:       # adds a "Run workflow" button for manual runs

jobs:
  extract-and-load:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract from API and load into Neon
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: "5432"
          DB_SSLMODE: "require"
        run: python load_raw.py